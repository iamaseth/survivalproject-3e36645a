name: TikTok enrichment verification
on:
  pull_request:
    paths:
      - 'src/lib/tiktok-enrichment.functions.ts'
      - 'src/components/settings/TikTokEnrichmentSection.tsx'
      - 'tests/tiktok-enrichment.test.mjs'
      - '.github/workflows/tiktok-enrichment-verification.yml'
  workflow_dispatch:
jobs:
  enrichment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-save
      - run: node tests/tiktok-enrichment.test.mjs
      - run: npm run build
