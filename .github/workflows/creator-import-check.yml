name: Creator import verification
on:
  pull_request:
    paths:
      - 'src/lib/creators.functions.ts'
      - 'src/components/settings/ImportCreatorsSection.tsx'
      - '.github/workflows/creator-import-check.yml'
  push:
    branches: ['feature/universal-creator-import']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
