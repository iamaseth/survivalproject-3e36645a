name: Deep YouTube Enrichment

on:
  push:
    paths:
      - "tools/creator-enrichment/src/deep-youtube.mjs"
      - ".github/workflows/deep-youtube-enrichment.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max qualified no-email creators"
        required: false
        default: "5"
      videos_per_channel:
        description: "Recent videos to inspect per creator"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: https://oqeebbimamcyzzbfrlws.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable__g2gVvguqn_rzf5H0IJdqw_m4HO6hZi
      YOUTUBE_INGEST_SECRET: ${{ secrets.YOUTUBE_INGEST_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DEEP_YOUTUBE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '5' }}
      DEEP_YOUTUBE_VIDEOS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.videos_per_channel || '10' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required configuration exists
        run: |
          if [ -z "$YOUTUBE_INGEST_SECRET" ]; then
            echo "Missing GitHub Actions secret: YOUTUBE_INGEST_SECRET"
            exit 1
          fi
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "Missing GitHub Actions secret: YOUTUBE_API_KEY"
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing Supabase public connection settings"
            exit 1
          fi

      - name: Enrich qualified creators from YouTube public data
        run: node tools/creator-enrichment/src/deep-youtube.mjs
