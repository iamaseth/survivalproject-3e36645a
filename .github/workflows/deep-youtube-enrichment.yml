name: Deep YouTube Enrichment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max qualified no-email creators"
        required: false
        default: "500"
      videos_per_channel:
        description: "Recent videos to inspect per creator"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      APP_BASE_URL: https://survivalproject.lovable.app
      YOUTUBE_INGEST_SECRET: ${{ secrets.YOUTUBE_INGEST_SECRET }}
      DEEP_YOUTUBE_LIMIT: ${{ github.event.inputs.limit || '500' }}
      DEEP_YOUTUBE_VIDEOS: ${{ github.event.inputs.videos_per_channel || '10' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required secret exists
        run: |
          if [ -z "$YOUTUBE_INGEST_SECRET" ]; then
            echo "Missing GitHub Actions secret: YOUTUBE_INGEST_SECRET"
            exit 1
          fi

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Enrich qualified creators from recent public video descriptions
        run: node tools/creator-enrichment/src/deep-youtube.mjs
