name: One-pass TikTok verification
on:
  pull_request:
    paths:
      - 'src/lib/tiktok-one-pass.functions.ts'
      - 'src/components/settings/OnePassTikTokSection.tsx'
      - 'src/components/settings/ImportCreatorsSection.tsx'
      - '.github/workflows/one-pass-tiktok-verification.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-save
      - run: node tests/creator-import.test.mjs
      - run: node tests/tiktok-enrichment.test.mjs
      - run: npm run build
