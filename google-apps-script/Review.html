<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:16px system-ui;background:#f4f7f4;color:#173c2c;margin:0}header{background:#173c2c;color:white;padding:18px}main{max-width:850px;margin:auto;padding:16px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #bacabc}button{background:#fff;cursor:pointer}button:disabled{opacity:.4}.card{background:white;border:1px solid #dce5dd;border-radius:12px;padding:18px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}a{color:#176d50}.muted{color:#64776b;font-size:13px}#notice{min-height:20px}</style></head><body>
<header><strong>Survival Tabs · Influencer Review</strong><div style="font-size:13px">Shared Google Sheet · Manual decisions override screening</div></header>
<main><div class="controls"><input id="search" placeholder="Search creators" oninput="render()"><select id="filter" onchange="render()"><option value="">All statuses</option><option>Needs Review</option><option>After First Review</option><option>Approved</option><option>Rejected</option><option>Assigned</option><option>Contacted</option><option>AI Excluded</option></select><button onclick="load()">Refresh</button></div><p id="notice">Loading…</p><div id="list"></div></main>
<script>
let creators=[];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){document.getElementById('notice').textContent='Loading…';google.script.run.withSuccessHandler(r=>{creators=r;render()}).withFailureHandler(e=>{document.getElementById('notice').textContent=e.message}).listCreators()}
function update(id,status){document.getElementById('notice').textContent='Saving…';google.script.run.withSuccessHandler(()=>{const c=creators.find(x=>x.id===id);if(c)c.status=status;render();document.getElementById('notice').textContent='Saved to Google Sheets'}).withFailureHandler(e=>{document.getElementById('notice').textContent='Save failed: '+e.message}).changeStatus(id,status)}
function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const found=creators.filter(c=>(!f||c.status===f)&&[c.name,c.id,c.tiktok].some(s=>s.toLowerCase().includes(q)));document.getElementById('notice').textContent=found.length+' of '+creators.length+' creators';const root=document.getElementById('list');root.replaceChildren();found.slice(0,100).forEach(c=>{const d=document.createElement('article');d.className='card';d.innerHTML='<strong>'+esc(c.name)+'</strong><div class="muted">'+esc(c.id)+' · '+esc(c.status)+' · AI screening: '+esc(c.screening)+'</div>'+(c.tiktok.startsWith('https://www.tiktok.com/')?'<p><a target="_blank" rel="noopener noreferrer" href="'+esc(c.tiktok)+'">Open TikTok profile ↗</a></p>':'')+'<div class="actions"></div>';const a=d.querySelector('.actions');['After First Review','Approved','Rejected','Assigned','Contacted'].forEach(s=>{const b=document.createElement('button');b.textContent=s;b.disabled=c.status===s;b.onclick=()=>update(c.id,s);a.append(b)});if(c.draft){const b=document.createElement('button');b.textContent='Copy DM draft';b.onclick=()=>navigator.clipboard.writeText(c.draft);a.append(b)}root.append(d)});if(found.length>100){const p=document.createElement('p');p.textContent='Showing first 100; search or filter to narrow the list.';root.append(p)}}
load();
</script></body></html>
